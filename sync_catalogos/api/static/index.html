<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>co-salud-catalogos · Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>
<body class="bg-slate-50 text-slate-800">
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">co-salud-catalogos</h1>
            <p class="text-slate-500 mt-2">Catálogos públicos del sector salud Colombia · API + dashboard</p>
        </div>

        <div class="bg-white shadow-lg rounded-lg p-8">
            <h2 class="text-xl font-semibold mb-4">Iniciar sesión</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                    <input type="text" id="username" required autofocus
                           class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="password" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div id="error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></div>
                <button type="submit" id="submitBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition disabled:opacity-50">
                    Entrar
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-200 text-sm text-slate-500 space-y-1">
                <div>API base: <code class="bg-slate-100 px-1 rounded text-xs" id="apiBase"></code></div>
                <div>Doc Swagger: <a href="/docs" class="text-indigo-600 hover:underline">/docs</a> · ReDoc: <a href="/redoc" class="text-indigo-600 hover:underline">/redoc</a></div>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            La documentación se filtra dinámicamente según los permisos del usuario.
        </p>
    </div>
</div>

<script>
document.getElementById("apiBase").textContent = window.location.origin;

// Si ya hay token válido, redirigir al dashboard
const stored = localStorage.getItem("salud_token");
if (stored) {
    fetch("/api/v1/auth/me", { headers: { Authorization: "Bearer " + stored } })
        .then(r => { if (r.ok) window.location.href = "/dashboard"; });
}

document.getElementById("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("submitBtn");
    const err = document.getElementById("error");
    err.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Entrando...";
    try {
        const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
            }),
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || `Error ${res.status}`);
        }
        const data = await res.json();
        localStorage.setItem("salud_token", data.access_token);
        localStorage.setItem("salud_username", data.username);
        localStorage.setItem("salud_role", data.role);
        localStorage.setItem("salud_token_exp", Date.now() + data.expires_in * 1000);
        window.location.href = "/dashboard";
    } catch (e) {
        err.textContent = e.message;
        err.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
    }
});
</script>
</body>
</html>
