[project]
name = "co-salud-catalogos"
version = "0.1.0"
description = "Sincronización de catálogos públicos del sector salud en Colombia (REPS, SISPRO, Datos Abiertos)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andres Fajardo" }]
license = { text = "MIT" }

dependencies = [
    "httpx[socks]>=0.27",   # [socks] añade socksio para soporte SOCKS5 en el pool de proxies
    "lxml>=5",
]

[project.optional-dependencies]
db       = ["sqlalchemy>=2.0"]                          # SQLite gratis con stdlib
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
mysql    = ["sqlalchemy>=2.0", "pymysql>=1.1"]
mssql    = ["sqlalchemy>=2.0", "pyodbc>=5.1"]
mongo    = ["pymongo>=4.8"]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sync_catalogos"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
